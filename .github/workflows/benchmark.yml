name: Benchmarks

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  token-benchmark:
    name: Level 1 Token Reduction
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install package + bench deps
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[bench]"
          pip install tree-sitter-python

      - name: Run token benchmark (fixture corpus, no API key)
        run: python -m benchmarks.run_token_benchmark

      - name: Upload results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: token-benchmark-results
          path: benchmarks/results/token_benchmark.json
          if-no-files-found: warn

  latency-benchmark:
    name: Level 2 Query Latency
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install package + bench deps
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[bench]"

      - name: Run pytest-benchmark (fixture corpus)
        run: |
          python -m pytest benchmarks/test_latency.py -q \
            --benchmark-json=benchmarks/results/level2_pytest_benchmark.json

      - name: Run latency harness (fixture corpus)
        run: |
          python -m benchmarks.run_latency_benchmark \
            --repos fixture --reps 10 --warmup 2

      - name: Upload results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: latency-benchmark-results
          path: |
            benchmarks/results/level2_pytest_benchmark.json
            benchmarks/results/level2_latency_fixture.json
            benchmarks/results/level2_latency_all.json
          if-no-files-found: warn
