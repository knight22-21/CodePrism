[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["codeprism"]

[project]
name = "codeprism"
version = "0.1.0"
description = "Persistent knowledge graph for AI coding agents — 60-80% token reduction"
license = { text = "MIT" }
requires-python = ">=3.12"
readme = "README.md"
authors = [
    { name = "knight22-21", email = "your-email@example.com" }
]
maintainers = [
    { name = "knight22-21", email = "your-email@example.com" }
]
keywords = [
    "mcp",
    "model-context-protocol",
    "ai",
    "code-analysis",
    "knowledge-graph",
    "ast",
    "static-analysis",
    "security",
    "code-indexing",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Code Generators",
    "Topic :: Software Development :: Libraries :: Python Modules",
]
dependencies = [
    "tree-sitter>=0.23",
    "tree-sitter-python",
    "tree-sitter-javascript",
    "tree-sitter-typescript",
    "tree-sitter-go",
    "networkx>=3.3",
    "aiosqlite>=0.20",
    "pydantic>=2.8",
    "watchdog>=4.0",
    "fastmcp>=2.0",
    "typer[all]>=0.12",
    "rich>=13.0",
    "platformdirs>=4.0",
]

[project.urls]
Homepage = "https://github.com/knight22-21/CodePrism"
Documentation = "https://github.com/knight22-21/CodePrism#readme"
Repository = "https://github.com/knight22-21/CodePrism"
"Bug Tracker" = "https://github.com/knight22-21/CodePrism/issues"

[project.optional-dependencies]
embeddings = [
    "sentence-transformers>=3.1.0",
    "chromadb>=0.5.0",
]
security-full = [
    "bandit>=1.7.0",
]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
    "pytest-cov>=5.0",
    "ruff>=0.6",
    "mypy>=1.11",
    "hypothesis>=6.0",
]

[project.scripts]
codeprism = "codeprism.cli:app"

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
ignore = ["B008"]

[tool.mypy]
python_version = "3.12"
strict = true
ignore_missing_imports = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.coverage.run]
source = ["codeprism"]
omit = ["tests/*"]
